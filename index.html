<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="247ho.com - Modern 24/7 Coming Soon." />
  <title>247ho.com | 24/7</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Ambient Glowing Background & Grid -->
  <div class="background" aria-hidden="true">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>
    <div class="grid"></div>
  </div>

  <main class="container">

    <!-- Header / Brand Logo -->
    <header class="header">
      <div class="logo-container">
        <img src="logo.png" alt="247ho.com Logo" class="brand-logo-img" />
      </div>
    </header>

    <!-- Hero Content -->
    <section class="hero">
      <h1>
        We're building <br />
        <span class="gradient-text">something amazing.</span>
      </h1>

      <p class="description">
        A new experience is on its way. We're working behind the scenes to bring you something worth waiting for.
      </p>

    </section>

    <!-- Footer -->
    <footer>
      <div class="footer-brand">
        <p>© 2026 <strong>247ho.com</strong> • All rights reserved.</p>
      </div>
    </footer>

  </main>
</body>

</html>
